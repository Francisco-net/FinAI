[project]
name = "finai"
version = "0.1.0"
description = "FinAI - assistente de IA que monta carteiras de investimento personalizadas para o mercado brasileiro"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",          # SDK oficial do Claude (agente + ferramentas)
    "pydantic>=2.7",           # modelos de domínio e validação das entradas das ferramentas
    "pydantic-settings>=2.3",  # configuração via variáveis de ambiente / .env
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",             # otimização de carteira (Markowitz)
    "httpx>=0.27",             # API do Banco Central (SGS)
    "pyyaml>=6.0",             # premissas de mercado e glossário versionados em YAML
    "typer>=0.12",             # CLI
    "rich>=13.7",
]

[project.optional-dependencies]
api = ["fastapi>=0.111", "uvicorn[standard]>=0.30"]
ui = ["streamlit>=1.36", "plotly>=5.22"]
market = ["yfinance>=0.2.40"]  # cotações da B3 / exterior
all = ["finai[api,ui,market]"]

[project.scripts]
finai = "finai.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-PyYAML",
    "pandas-stubs",
    "ipykernel>=6.29",         # notebooks de exploração
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finai"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]  # E501: o formatter cuida; RUF00x: acentos em português

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
